name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis8:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      HAYAKV_DIFF_REDIS_ADDR: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race -count=1 ./config ./internal/datastruct/... ./internal/proto/... ./internal/net/goroutine ./internal/net/eventloop ./internal/server ./internal/iface ./internal/command ./cmd/hayakv -timeout 10m

      - name: Integration tests
        run: go test -count=1 ./test/integration

      - name: Replication tests
        run: go test -count=1 -p 1 ./test/integration -run 'TestReplica|TestReplconf|TestWait|TestDiskless|TestPartial|TestFullResync|TestLive|TestPromote|TestInfoReplication'

      - name: Differential tests
        run: |
          go test -count=1 ./test/diff -run TestDifferentialRESP2
          go test -count=1 ./test/diff -run TestDifferentialRedisDB

      - name: Build
        run: go build ./cmd/hayakv
