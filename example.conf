########################## hayakv configuration ##########################
#
# hayakv reads ./redis.conf from the working directory by default.
# Use the CONFIG environment variable to point at another file:
#
#   CONFIG=example.conf ./hayakv
#
##########################################################################

############################### GENERAL ##################################

# Accept connections on this address / port.
bind 0.0.0.0
port 6399

# Working directory. AOF, RDB and cluster metadata are written here.
# dir .

# Number of logical databases (SELECT 0..N-1).
databases 16

# Maximum number of simultaneous client connections.
maxclients 128

# Require clients to AUTH before running commands.
# requirepass yourpassword

############################### BACKENDS #################################
#
# Each layer of the server has two implementations selectable at runtime,
# so they can be A/B-compared against the same test corpus.

# Network model:
#   goroutine -- one goroutine per connection (default)
#   eventloop -- single-threaded event loop on epoll (Linux) / kqueue (macOS)
net goroutine

# Storage engine:
#   shardmap -- sharded concurrent map with per-key locking (default)
#   redisdb  -- single dict with incremental rehash, like real Redis
#               (wrapped in a global lock under net=goroutine; under
#               net=eventloop the single-threaded loop provides exclusion)
engine shardmap

# Highest RESP protocol version negotiable via HELLO:
#   resp2 -- RESP2 only
#   resp3 -- accept HELLO 3 (RESP3); RESP2 clients still work
proto-max resp2

############################# PERSISTENCE ################################

# Enable AOF persistence. RDB snapshots are produced via AOF rewrite, so
# any form of persistence or replication requires AOF to be enabled.
appendonly no

# Single-file AOF name, relative to `dir`.
appendfilename appendonly.aof

# Multi-part AOF directory (Redis 7+ manifest layout). When set, the AOF
# is stored as base + incr files under this directory.
# appenddirname appendonlydir

# fsync policy: always | everysec | no
appendfsync everysec

# AOF rewrite emits an RDB preamble (hybrid persistence).
aof-use-rdb-preamble yes

# RDB filename, relative to `dir`.
dbfilename dump.rdb

# RDB codec: faithful (built-in, byte-faithful to real Redis) or library
# (third-party decoder).
# rdb-impl faithful

########################### MEMORY / EXPIRY ##############################

# Memory limit in bytes; 0 = unlimited. Accepts 100mb / 1gb style suffixes.
# maxmemory 0

# Eviction policy once maxmemory is reached:
#   noeviction | allkeys-lru | allkeys-lfu | allkeys-random
#   volatile-lru | volatile-lfu | volatile-random | volatile-ttl
# maxmemory-policy noeviction

# Sample size for the LRU/LFU eviction pool (Redis default 5).
# maxmemory-samples 5

# serverCron frequency (active expire cycle etc.); ticks every 1000/hz ms.
# hz 10

############################## ENCODINGS #################################
#
# Thresholds for converting compact encodings (listpack/intset) to
# hashtable/skiplist — same semantics and defaults as real Redis.

# hash-max-listpack-entries 128
# hash-max-listpack-value 64
# set-max-intset-entries 512
# set-max-listpack-entries 128
# set-max-listpack-value 64
# zset-max-listpack-entries 128
# zset-max-listpack-value 64
# list-max-listpack-size 128

############################### SLOW LOG #################################

# Log commands whose execution time exceeds this many microseconds.
# A negative value disables the slow log; 0 logs every command.
slowlog-log-slower-than 10000

# Maximum entries kept in the slow log (SLOWLOG RESET reclaims memory).
slowlog-max-len 128

############################# REPLICATION ################################

# Password of the master, if the master sets `requirepass`.
# masterauth masterpassword

# Stop replication if nothing is received from the master for this many
# seconds.
# repl-timeout 60

# Announce address for a replica behind NAT: the master will dial this
# address instead of the TCP peer address.
# slave-announce-ip 5.5.5.5
# slave-announce-port 1234

# Replication backlog size in bytes: the ring buffer of recent replication
# stream used to serve partial resync (PSYNC +CONTINUE). A larger backlog
# widens the partial-resync window. Default 1mb.
# repl-backlog-size 1048576

# Diskless replication: stream the RDB straight to the replica socket with
# EOF-marked framing instead of going through a temp file.
# repl-diskless-sync no

############################### CLUSTER ##################################

# Enable cluster mode. The options below take effect only when yes.
# cluster-enable yes

# Cluster flavor:
#   redis       -- native Redis Cluster protocol: CLUSTER MEET / ADDSLOTS,
#                  MOVED/ASK redirection, gossip bus on port+10000
#   "" or unset -- Raft-based proxy cluster, transparent to clients
# cluster-mode redis

# Node state file for cluster-mode=redis: persists the node ID, slot
# ownership and known peers. Created on first boot, updated automatically,
# written atomically. Relative paths resolve against `dir`.
# cluster-config-file nodes.conf

# --- Raft proxy cluster only ---

# Raft listen address, and the announce address to use behind NAT.
# raft-listen-address 0.0.0.0:16666
# raft-advertise-address 4.4.4.4:16666

# Bootstrap a new cluster. Only takes effect when no cluster data exists
# on disk; nodes rejoin automatically after restart.
# cluster-as-seed yes

# Join an existing cluster through any member. Use the redis service
# address, NOT the raft address. Only used on first join.
# cluster-seed 6.6.6.6:6399

# Join the cluster as a replica of this member (redis service address).
# master-in-cluster 6.6.6.6:6399
